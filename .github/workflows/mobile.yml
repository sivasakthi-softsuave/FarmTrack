name: mobile

on:
  push:
    paths: ['mobile/**', 'voice/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'voice/**', '.github/workflows/mobile.yml']
  workflow_dispatch:          # build an APK on demand (Actions tab, or `gh workflow run mobile`)

# Least privilege: the job only reads the repository (no token write scopes, no secrets are used).
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Voice assets are in sync with voice/prompts.json
        run: |
          python tool/sync_voice_assets.py
          git diff --exit-code -- assets pubspec.yaml
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Android APK (arm64, release mode) built on the runner's preinstalled Android SDK, so no developer PC needs the SDK.
  # Server address: the app default (API_BASE_URL; changeable in the app). Signed with the runner's throwaway debug key, so a
  # new APK cannot be installed over one from another run: uninstall the old app first. An IPA needs Xcode: not done here.
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: FarmTrack-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
